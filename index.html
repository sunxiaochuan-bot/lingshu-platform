:root{
  /* 底色：墨蓝黑，比纯黑多一寸蓝，饱和度压到最低 */
  --bg0:#05070D;
  --bg1:#0A0E17;
  --bg2:#10151F;
  /* 结构线与流线：月光白低透明度 */
  --ink-line:rgba(210,224,240,.13);
  --ink-line-2:rgba(210,224,240,.26);
  --ink-line-3:rgba(210,224,240,.45);
  /* 唯一彩色强调 */
  --gold:#E4B15E;
  --gold-hi:#F5CF8A;
  --gold-dim:rgba(228,177,94,.42);
  --gold-faint:rgba(228,177,94,.16);
  /* 文字 */
  --moon:#DDE6F0;
  --txt2:#93A0B4;
  --txt3:#5C6878;
  /* 辅助冷蓝：仅图表次系列，禁发光 */
  --star:#8FB0D8;
  /* 语义红：全站 ≤2 处 */
  --alert:#D96A5A;

  --r:2px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"LingShu Song","Songti SC","SimSun",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  /* 全站唯一调色链（影视飓风式 LUT）：只在此处定义，禁止单元素私调色相 */
  --lut:brightness(.82) contrast(1.12) saturate(.82) hue-rotate(-14deg) sepia(.2);
  /* 细节增强（高清模式）：同一条调色链的延伸，只加深微反差与边缘，不新增色相 */
  --detail:contrast(1.06) brightness(1.03) saturate(1.04);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:rgba(210,224,240,.2) transparent; }
body{
  background:var(--bg0); color:var(--moon); font-family:var(--sans);
  font-size:14px; line-height:1.9; letter-spacing:.015em;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body.locked{ overflow:hidden; height:100%; }
::selection{ background:rgba(228,177,94,.24); color:#fff; }
:focus-visible{ outline:1px solid var(--gold); outline-offset:3px; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(210,224,240,.14); }
::-webkit-scrollbar-thumb:hover{ background:rgba(210,224,240,.26); }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; color:inherit; }
canvas{ display:block; }
.hidden{ display:none !important; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.serif{ font-family:var(--serif); }

/* ══════════════ 字体层级 ══════════════ */
h1,h2,h3,h4{ font-family:var(--serif); font-weight:900; letter-spacing:.08em; margin:0; }
/* eyebrow：mono 小写编号，月光白 40%，禁彩色 */
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
  color:rgba(221,230,240,.4); text-transform:lowercase;
}
h2.sec{
  font-size:clamp(22px,2.4vw,31px); font-weight:900; line-height:1.35;
  padding-left:14px; position:relative;
}
h2.sec::before{
  content:''; position:absolute; left:0; top:.28em; bottom:.28em; width:2px; background:var(--gold);
}
.lede{ color:var(--txt2); max-width:34em; line-height:1.8; }
.statement{
  font-family:var(--serif); font-weight:700; font-size:clamp(17px,1.7vw,22px);
  line-height:1.75; color:var(--moon); letter-spacing:.04em;
}
.statement .num{
  font-family:var(--serif); font-weight:900; color:var(--gold); font-size:1.28em;
  padding:0 .12em; letter-spacing:.02em;
}
.gold{ color:var(--gold); }
.dim{ color:var(--txt2); }
.dim3{ color:var(--txt3); }

/* ══════════════ 顶栏状态带（28px，mono 信息密度） ══════════════ */
#statusbar{
  position:sticky; top:0; z-index:60; height:28px; display:flex; align-items:center;
  gap:18px; padding:0 14px; background:var(--bg0); border-bottom:1px solid var(--ink-line);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  color:rgba(221,230,240,.62); white-space:nowrap; overflow:hidden;
}
#statusbar .sb-l{ color:var(--moon); }
#statusbar .sb-l b{ font-weight:400; color:var(--gold); }
#statusbar .sb-c{ flex:1; text-align:center; color:rgba(221,230,240,.4); }
#statusbar .sb-r{ display:flex; gap:14px; }
#statusbar .sb-r i{ font-style:normal; color:rgba(221,230,240,.34); }
#statusbar .sb-r b{ font-weight:400; color:var(--moon); }
#statusbar .sb-ds{ display:flex; align-items:center; gap:6px; padding-left:12px;
  border-left:1px solid var(--ink-line); }
#statusbar .sb-ds i{ font-style:normal; color:rgba(221,230,240,.34); }
#statusbar .sb-ds select{ background:none; border:0; padding:0 2px; cursor:pointer;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--moon);
  max-width:210px; }
#statusbar .sb-ds select.is-upload{ color:var(--gold-hi); font-weight:600; }
#statusbar .sb-ds select option{ background:var(--bg2); color:var(--txt); }
#eval-toggle{ background:none; border:0; padding:0 0 0 12px; cursor:pointer; font-family:var(--mono);
  font-size:10.5px; letter-spacing:.1em; color:rgba(221,230,240,.4); border-left:1px solid var(--ink-line); }
#eval-toggle.on{ color:var(--gold); }
#eval-toggle:hover{ color:var(--moon); }

/* ══════════════ 背景层：视频 → 星野 → 暗角（统一走 LUT） ══════════════ */
#bg-stack{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#bg-video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:.5; filter:var(--lut); transform:scale(1.02);
  transition:opacity .8s ease-out, clip-path .8s ease-out;
}
/* 高清模式：叠加细节增强，并允许用 image-rendering 提升放大锐度 */
body.quality-high #bg-video,
body.quality-high #gate-video{ filter:var(--lut) var(--detail); }
body.quality-high #bg-video{ opacity:.54; }
/* 数据之瀑在屏时：背景层压暗，对比度全部让给主角 */
/* 总览页：星云只作右下角 1/4 的底噪（≤8%），其余区域一律近黑 —— 舞台唯一光源是数据 */
body.wf-live #bg-video{ opacity:.08; clip-path:inset(52% 0 0 52%); }
body.wf-live #bg-stars{ opacity:.28; }
body.wf-live #bg-vignette{ background:
  radial-gradient(ellipse 70% 58% at 50% 44%, rgba(5,7,13,.55) 16%, rgba(5,7,13,.86) 70%, rgba(5,7,13,.98) 100%),
  linear-gradient(180deg, rgba(5,7,13,.88) 0%, transparent 22%, transparent 52%, var(--bg0) 100%); }
#bg-poster{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.5; filter:var(--lut); display:none; }
body.quality-high #bg-poster{ filter:var(--lut) var(--detail); }
#bg-stars{ position:absolute; inset:0; }
#bg-vignette{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 88% 74% at 50% 44%, transparent 30%, rgba(5,7,13,.55) 74%, rgba(5,7,13,.94) 100%),
    linear-gradient(180deg, rgba(5,7,13,.72) 0%, transparent 22%, transparent 58%, var(--bg0) 100%);
}
/* 静态海报模式（移动端 / reduced-motion / 视频缺失） */
body.poster-mode #bg-video{ display:none; }
body.poster-mode #bg-poster{ display:block; }

/* ══════════════ 布局骨架 ══════════════ */
#app-shell{ position:relative; z-index:2; }
.shell-body{ display:grid; grid-template-columns:212px minmax(0,1fr); }
.rail{
  position:sticky; top:28px; align-self:start; height:calc(100vh - 28px);
  padding:22px 0 22px 0; border-right:1px solid var(--ink-line);
  display:flex; flex-direction:column; overflow-y:auto;
}
.rail .rail-title{
  font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:rgba(221,230,240,.32);
  padding:0 20px 16px;
}
.rail button{
  position:relative; display:block; width:100%; padding:9px 20px; text-align:left;
  background:none; border:0; border-left:1px solid transparent; cursor:pointer;
  transition:color .28s ease, border-color .28s ease, background .28s ease;
}
.rail button .idx{ font-family:var(--mono); font-size:10px; color:rgba(221,230,240,.3); margin-right:10px; }
.rail button .lbl{ font-size:13.5px; color:var(--txt2); letter-spacing:.03em; }
.rail button .lbl small{ display:none; }
.rail button:hover .lbl{ color:var(--moon); }
.rail button.on{ border-left-color:var(--gold); background:linear-gradient(90deg, rgba(228,177,94,.07), transparent 70%); }
.rail button.on .idx{ color:var(--gold); }
.rail button.on .lbl{ color:var(--moon); }
.rail .rail-foot{
  margin-top:auto; padding:16px 20px 0; border-top:1px solid var(--ink-line);
  font-family:var(--mono); font-size:10px; line-height:2; color:rgba(221,230,240,.3);
}
/* 页面底部竖排小字 */
.vertical-mark{
  writing-mode:vertical-rl; text-orientation:upright;
  font-family:var(--serif); font-size:13px; letter-spacing:.42em; color:rgba(221,230,240,.28);
  position:absolute; right:18px; bottom:40px; user-select:none;
}

.view{ padding:30px 40px 120px; max-width:1560px; min-width:0; position:relative; }
@media (max-width:1240px){ .view{ padding:26px 26px 100px; } }

/* ══════════════ 观测报告版式（场景页 / 检索页通用） ══════════════ */
.obs-head{ display:grid; grid-template-columns:74px minmax(0,1fr); gap:0 22px; margin-bottom:22px; }
.obs-no{
  font-family:var(--serif); font-weight:900; font-size:44px; line-height:1; color:rgba(221,230,240,.14);
  letter-spacing:0; padding-top:6px;
}
.obs-head .eyebrow{ display:block; margin-bottom:10px; }
.obs-head h2.sec{ margin-bottom:12px; }
.obs-concl{
  margin-top:14px; padding-top:12px; border-top:1px solid var(--ink-line);
  font-family:var(--serif); font-size:15px; line-height:1.85; color:var(--moon); max-width:44em;
}
.obs-concl .num{ font-family:var(--serif); font-weight:900; color:var(--gold); font-size:1.3em; padding:0 .1em; }

/* ══════════════ 数据之瀑（第 8 节 · 总览唯一主角） ══════════════ */
.wf-wrap{
  position:relative; width:100%; height:min(76vh,820px); min-height:500px;
  border-top:1px solid var(--ink-line-2); border-bottom:1px solid var(--ink-line-2);
  overflow:hidden; background:radial-gradient(ellipse 78% 62% at 50% 50%, rgba(143,176,216,.05), transparent 70%);
}
.wf-canvas{ position:absolute; inset:0; cursor:crosshair; }
/* 天球坐标网格：10% 透明度，只作底纹 */
.wf-grid{
  position:absolute; inset:0; pointer-events:none; opacity:.1;
  background-image:linear-gradient(rgba(221,230,240,.5) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(221,230,240,.5) 1px, transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse at 50% 45%, #000 30%, transparent 82%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%, #000 30%, transparent 82%);
}
/* 四角 mono 数据轨 */
.wf-hud{
  position:absolute; z-index:3; pointer-events:none;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; line-height:1.9;
  color:rgba(221,230,240,.42); min-width:152px;
}
.wf-hud.tl{ left:16px; top:14px; }
.wf-hud.tr{ right:16px; top:14px; text-align:right; }
.wf-hud.bl{ left:16px; bottom:14px; }
.wf-hud.br{ right:16px; bottom:14px; text-align:right; }
.wf-hud .hud-t{
  color:rgba(221,230,240,.28); text-transform:uppercase; letter-spacing:.2em;
  margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--ink-line);
}
.wf-hud .hud-kv{ display:flex; gap:12px; justify-content:space-between; }
.wf-hud.tr .hud-kv, .wf-hud.br .hud-kv{ flex-direction:row-reverse; }
.wf-hud .hud-kv b{ font-weight:400; color:var(--moon); font-variant-numeric:tabular-nums; }
.wf-hud .hud-kv b.gold{ color:var(--gold); }
.wf-hud .chip-state{ color:rgba(221,230,240,.5); }
/* 事件芯片：最近查询结果悬浮瀑中（≤3 枚） */
.wf-chips{ position:absolute; right:16px; top:0; bottom:0; z-index:4; width:232px; pointer-events:none; }
.wf-chip{
  position:absolute; right:0; pointer-events:auto; cursor:pointer;
  display:flex; align-items:baseline; gap:9px; padding:8px 12px;
  border:1px solid var(--ink-line-2); background:rgba(5,7,13,.72); border-radius:var(--r);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--txt2);
  transition:border-color .24s ease, color .24s ease;
}
.wf-chip:hover{ border-color:var(--gold-dim); color:var(--moon); }
.wf-chip .k{ color:rgba(221,230,240,.34); }
.wf-chip b{ font-weight:400; color:var(--moon); }
.wf-chip .v{ margin-left:auto; font-family:var(--serif); font-weight:700; color:var(--gold); font-size:12px; }

/* 终端流：等宽、增量追加、只渲染可视区 */
.log-box{
  height:186px; overflow:hidden; border:1px solid var(--ink-line); border-radius:var(--r);
  padding:8px 10px; background:rgba(10,14,23,.6);
}
.log-row{ display:flex; gap:10px; height:18px; align-items:center; font-family:var(--mono); font-size:10.5px; }
.log-row .t{ color:rgba(221,230,240,.28); flex:none; }
.log-row .m{ color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.log-row.hit .m{ color:var(--gold-hi); }
.log-row.warn .m{ color:var(--alert); }

/* 09 结果卡：入库完成的一记金色确认（数据真的进来了） */
@keyframes ingFlash{ 0%{ background:rgba(228,177,94,.18); box-shadow:0 0 24px rgba(228,177,94,.22); } 100%{ background:transparent; box-shadow:none; } }
#ing-result.flash{ animation:ingFlash .85s ease .05s; border-radius:4px; padding:6px 8px; margin-left:-8px; }

/* 细分隔线排版（替代卡片阵列） */
.rule{ height:1px; background:var(--ink-line); margin:34px 0 0; }
/* block：无边框分栏块（原卡片结构的替代） */
.block{ margin-top:22px; }
.block-h{ display:flex; align-items:baseline; gap:14px; padding-bottom:10px; border-bottom:1px solid var(--ink-line-2); }
.block-h h3{ font-family:var(--serif); font-weight:700; font-size:16px; letter-spacing:.05em; }
.block-h .tag{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:rgba(221,230,240,.34); }
.block-h .right{ margin-left:auto; display:flex; gap:10px; align-items:center; }
.block-b{ padding-top:16px; }
.grid{ display:grid; gap:0; }
.g-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.g-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.g-2-1{ grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); }
.g-1-2{ grid-template-columns:minmax(0,1fr) minmax(0,1.7fr); }
/* 用竖向细分隔线代替卡片边界 */
.col{ padding:22px 26px 22px 0; border-top:1px solid var(--ink-line); min-width:0; }
.col + .col{ padding-left:26px; border-left:1px solid var(--ink-line); }
.col:last-child{ padding-right:0; }
@media (max-width:1180px){
  .g-4,.g-3{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .g-2-1,.g-1-2{ grid-template-columns:minmax(0,1fr); }
  .col + .col{ padding-left:0; border-left:0; }
}
@media (max-width:860px){
  .shell-body{ grid-template-columns:1fr; }
  .rail{ position:static; height:auto; flex-direction:row; overflow-x:auto; border-right:0;
         border-bottom:1px solid var(--ink-line); padding:10px 0; }
  .rail .rail-title,.rail .rail-foot{ display:none; }
  .rail button{ width:auto; flex:none; border-left:0; border-bottom:1px solid transparent; padding:6px 14px; }
  .rail button.on{ border-left-color:transparent; border-bottom-color:var(--gold); background:none; }
  .g-2,.g-3,.g-4{ grid-template-columns:minmax(0,1fr); }
  .obs-head{ grid-template-columns:1fr; }
  .obs-no{ font-size:32px; }
  .vertical-mark{ display:none; }
  .view{ padding:20px 16px 80px; }
}

/* ══════════════ 无框大数字 ══════════════ */
.figure{ display:flex; flex-direction:column; gap:6px; }
.figure .k{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:rgba(221,230,240,.34); }
.figure .v{
  font-family:var(--serif); font-weight:900; font-size:clamp(30px,3.4vw,46px); line-height:1.05;
  color:var(--moon); letter-spacing:.01em; font-variant-numeric:tabular-nums;
}
.figure .v small{ font-family:var(--serif); font-weight:700; font-size:.42em; color:var(--txt2); margin-left:.35em; letter-spacing:.06em; }
.figure .v.gold{ color:var(--gold); }
.figure .d{ font-size:11.5px; color:var(--txt3); line-height:1.8; }

/* ══════════════ 观测台数据桌（表格） ══════════════ */
.tbl-wrap{ overflow:auto; max-height:560px; border-top:1px solid var(--ink-line-2); }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.tbl.risk-table{ min-width:1260px; }
button.risk-code{ all: unset; cursor:pointer; color:var(--gold); font-family:var(--mono); font-size:10.5px; line-height:1.7; }
button.risk-code:hover{ text-decoration:underline; text-underline-offset:3px; }
.depth-dock{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
.depth-card{ min-height:112px; padding:14px; border:1px solid rgba(221,230,240,.13); border-radius:8px;
  background:linear-gradient(145deg,rgba(221,230,240,.08),rgba(221,230,240,.025)); color:var(--moon);
  display:flex; flex-direction:column; align-items:flex-start; gap:7px; text-align:left; cursor:pointer;
  opacity:0; transform:translateY(8px); animation:depthIn .52s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(var(--i) * 70ms); transition:border-color .2s ease,transform .2s ease,background .2s ease; }
.depth-card:hover{ border-color:rgba(228,177,94,.52); background:linear-gradient(145deg,rgba(228,177,94,.13),rgba(221,230,240,.035)); transform:translateY(-2px); }
.depth-card-name{ font-family:var(--serif); font-size:17px; font-weight:900; letter-spacing:0; }
.depth-card small{ color:var(--txt-2); font-size:11px; line-height:1.5; }
.depth-card b{ margin-top:auto; color:var(--gold); font-family:var(--mono); font-size:10.5px; font-weight:500; }
.depth-modal{ position:fixed; inset:0; z-index:9999; display:grid; place-items:center; padding:20px;
  background:rgba(3,6,12,.66); backdrop-filter:blur(18px) saturate(125%); -webkit-backdrop-filter:blur(18px) saturate(125%);
  animation:depthFade .22s ease forwards; }
.depth-dialog{ width:min(760px,100%); max-height:86vh; overflow:auto; padding:18px; border:1px solid rgba(221,230,240,.22);
  border-radius:22px; background:linear-gradient(145deg,rgba(26,31,42,.92),rgba(9,12,20,.86));
  box-shadow:0 24px 70px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(26px) saturate(135%); -webkit-backdrop-filter:blur(26px) saturate(135%); }
.depth-bubble{ opacity:0; transform:translateY(10px) scale(.985); animation:depthBubble .48s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(var(--i) * 90ms); }
.depth-dialog-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:1px solid rgba(221,230,240,.12); }
.depth-kicker{ color:var(--gold); font-family:var(--mono); font-size:10px; letter-spacing:.08em; }
.depth-dialog-head h3{ margin:6px 0 0; font-family:var(--serif); font-size:25px; color:var(--moon); }
.depth-close{ width:28px; height:28px; border:1px solid rgba(221,230,240,.18); border-radius:50%; background:rgba(221,230,240,.06);
  color:var(--txt-2); font-size:20px; line-height:1; cursor:pointer; }
.depth-close:hover{ color:var(--moon); border-color:rgba(228,177,94,.5); }
.depth-logic{ margin-top:12px; padding:10px 12px; border-left:2px solid var(--gold); background:rgba(228,177,94,.055); }
.depth-logic strong{ display:block; margin-bottom:4px; color:var(--gold); font-size:11px; }
.depth-logic p{ margin:0; color:var(--txt-2); font-size:11.5px; line-height:1.75; }
.depth-input-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.depth-input-grid label,.depth-full{ display:flex; flex-direction:column; gap:6px; color:var(--txt-2); font-size:11px; }
.depth-full{ margin-top:12px; }
.depth-input-grid input,.depth-input-grid select,.depth-input-grid textarea,.depth-full textarea{
  width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid rgba(221,230,240,.16); border-radius:7px;
  background:rgba(3,6,12,.42); color:var(--moon); font:11px/1.65 var(--mono); outline:none; resize:vertical; }
.depth-input-grid input:focus,.depth-input-grid select:focus,.depth-input-grid textarea:focus,.depth-full textarea:focus{ border-color:rgba(228,177,94,.55); }
.depth-actions{ display:flex; gap:8px; margin-top:10px; }
.depth-summary{ margin-top:12px; padding:10px 12px; border:1px solid rgba(228,177,94,.22); border-radius:7px;
  background:rgba(228,177,94,.055); display:flex; flex-direction:column; gap:4px; }
.depth-summary strong{ color:var(--moon); font-size:12px; }
.depth-summary span{ color:var(--txt-2); font-size:11px; line-height:1.6; }
.depth-result-table{ margin-top:10px; max-height:300px; border:1px solid rgba(221,230,240,.1); }
.depth-result-table table.tbl{ min-width:620px; }
.depth-ticket-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.depth-ticket-row{ padding:8px 10px; border:1px solid rgba(221,230,240,.12); border-radius:6px; background:rgba(221,230,240,.035);
  display:grid; grid-template-columns:1fr auto; gap:3px 10px; }
.depth-ticket-row b{ color:var(--moon); font-size:11px; }
.depth-ticket-row span{ color:var(--gold); font-size:10px; }
.depth-ticket-row small{ grid-column:1/-1; color:var(--txt-2); font-size:10.5px; }
.tree-select{ display:flex; flex-direction:column; gap:6px; color:var(--txt-2); font-size:11px; margin-bottom:10px; }
.tree-select select{ width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid rgba(221,230,240,.16); border-radius:6px;
  background:rgba(3,6,12,.42); color:var(--moon); font:11px/1.5 var(--mono); }
.tree-list{ border:1px solid rgba(221,230,240,.1); border-radius:7px; background:rgba(221,230,240,.025); padding:8px 10px; max-height:430px; overflow:auto; }
.tree-list details{ margin:2px 0 2px 12px; }
.tree-list > details{ margin-left:0; }
.tree-list summary{ list-style:none; cursor:pointer; padding:5px 0; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
.tree-list summary::-webkit-details-marker{ display:none; }
.tree-list summary:hover b{ color:var(--gold); }
.tree-list summary b{ color:var(--moon); font-size:11.5px; font-weight:500; }
.tree-list summary small{ color:var(--txt-3); font-size:10px; }
.tree-caret{ color:var(--gold); width:10px; flex:none; font-size:10px; }
.tree-children{ border-left:1px solid rgba(228,177,94,.22); margin-left:4px; padding-left:9px; }
.tree-leaf{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; padding:5px 4px; border-bottom:1px solid rgba(221,230,240,.055); }
.tree-leaf span{ color:var(--txt-2); font-size:10.5px; line-height:1.5; overflow-wrap:anywhere; }
.tree-leaf small{ color:var(--txt-3); font-size:9.5px; grid-column:1; }
.tree-leaf b{ color:var(--gold); font:10px/1.5 var(--mono); grid-column:2; grid-row:1 / span 2; align-self:center; }
.tree-subhead{ color:var(--gold); font-size:9.5px; margin:8px 4px 2px; letter-spacing:.04em; }
.tree-more{ color:var(--txt-3); font-size:10px; padding:5px 4px; }
.tree-project > summary{ border-top:1px solid rgba(221,230,240,.055); margin-top:3px; }
@keyframes depthIn{ to{ opacity:1; transform:translateY(0); } }
@keyframes depthFade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes depthBubble{ to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes gateCleanAuto{ to{ opacity:0; pointer-events:none; } }
@media (max-width:620px){
  .depth-modal{ padding:10px; }
  .depth-dialog{ padding:14px; border-radius:18px; }
  .depth-input-grid{ grid-template-columns:1fr; }
}
table.tbl th{
  position:sticky; top:0; z-index:2; text-align:left; padding:11px 14px;
  background:var(--bg0); border-bottom:1px solid var(--ink-line-2);
  font-family:var(--mono); font-size:9.5px; font-weight:400; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(221,230,240,.44); white-space:nowrap;
}
table.tbl td{
  padding:0 14px; height:44px; border-bottom:1px solid var(--ink-line);
  color:var(--moon); vertical-align:middle;
}
table.tbl tr:hover td{ background:var(--bg2); }
table.tbl td.num{
  font-family:var(--serif); font-weight:700; text-align:right; white-space:nowrap;
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
}
table.tbl td.num.gold{ color:var(--gold); }
table.tbl td.mono{ font-family:var(--mono); font-size:11.5px; color:var(--txt2); }
/* 命中关键字：金色下划线，禁色块 */
mark{ background:none; color:var(--moon); border-bottom:1px solid var(--gold); padding-bottom:1px; }
/* 行首金色 tick（检索联动显影用） */
tr.hit td:first-child{ position:relative; }
tr.hit td:first-child::before{
  content:''; position:absolute; left:4px; top:50%; width:5px; height:1px; background:var(--gold);
  transform:translateY(-50%) scaleX(0); transform-origin:left;
}
tr.hit.shown td:first-child::before{ transform:translateY(-50%) scaleX(1); transition:transform .28s ease; }

.pill{
  display:inline-block; padding:1px 8px; border:1px solid var(--ink-line-2); border-radius:var(--r);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--txt2); background:none;
}
.pill.gold{ border-color:var(--gold-dim); color:var(--gold-hi); }
.pill.alert{ border-color:rgba(217,106,90,.5); color:var(--alert); }

/* ══════════════ 筛选：一行底线输入 + 下拉 ══════════════ */
.filters{ display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; padding:4px 0 14px; }
.filters .f{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.filters .f > label{ font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; color:rgba(221,230,240,.34); }
.filters input[type=text],.filters input[type=search],.filters select{
  background:none; border:0; border-bottom:1px solid var(--ink-line-2); border-radius:0;
  color:var(--moon); padding:5px 2px; font-size:13px; font-family:inherit;
  transition:border-color .25s ease; min-width:120px;
}
.filters input:focus,.filters select:focus{ outline:none; border-bottom-color:var(--gold); }
.filters input.search{ min-width:300px; }
.filters select option{ background:var(--bg2); color:var(--moon); }

/* ══════════════ 按钮（唯一 999px 圆角） ══════════════ */
.btn{
  display:inline-flex; align-items:center; gap:9px; cursor:pointer;
  padding:9px 20px; border-radius:999px; border:1px solid var(--ink-line-2);
  background:none; color:var(--moon);
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  transition:color .24s ease, border-color .24s ease, background .24s ease;
}
.btn:hover{ border-color:var(--ink-line-3); background:rgba(210,224,240,.05); }
.btn.primary{ border-color:var(--gold-dim); color:var(--gold-hi); }
.btn.primary:hover{ border-color:var(--gold); background:var(--gold-faint); }
.btn.ghost{ border-color:var(--ink-line); color:var(--txt2); }
.btn.small{ padding:6px 14px; font-size:10px; }
.btn[disabled]{ opacity:.35; cursor:not-allowed; }

/* ══════════════ 开场层（分镜见 app.js Gate 时间轴） ══════════════ */
#gate{
  position:fixed; inset:0; z-index:900; overflow:hidden;
  background:#000 url("assets/poster-hero.jpg") center/cover no-repeat;
}
#gate::after{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 48%, transparent 0 34%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.72) 100%),
    linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.04) 42%, rgba(0,0,0,.44));
}
#gate.done{ opacity:0; pointer-events:none; transition:opacity .8s ease .05s; }
#gate.gone{ display:none; }
/* 上下 letterbox */
#gate .bar-t,#gate .bar-b{
  position:absolute; left:0; right:0; height:5vh; background:#000; z-index:6;
  transition:transform .9s cubic-bezier(.2,.8,.2,1);
}
#gate .bar-t{ top:0; } #gate .bar-b{ bottom:0; }
#gate.open .bar-t{ transform:translateY(-100%); }
#gate.open .bar-b{ transform:translateY(100%); }

/* 镜1：中央 1px 金线生长 */
#gate-hair{
  position:absolute; left:50%; top:50%; height:1px; width:0; background:var(--gold);
  transform:translate(-50%,-50%); z-index:4; opacity:.9;
}
#gate.phase-line #gate-hair{ animation:hairGrow .7s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes hairGrow{ from{ width:0; opacity:.2 } to{ width:28vw; opacity:1 } }

/* 镜2：星野层（星等三级，独立闪烁相位） */
#gate-stars{ position:absolute; inset:0; z-index:2; opacity:0; }
#gate.phase-dust #gate-stars{ animation:fadeIn 1.6s ease forwards; }
@keyframes fadeIn{ to{ opacity:1 } }
/* 视频层归位：只做极缓慢的 scale，不白闪 */
#gate-video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transform:scale(1.05); filter:var(--lut); z-index:1;
  /* 高清模式优先：让浏览器以完整色度采样解码后再降采样，减少放大后的糊感 */
  image-rendering:auto;
}
#gate.phase-dust #gate-video{ animation:vidSettle 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes vidSettle{ from{ opacity:0; transform:scale(1.05) } to{ opacity:.62; transform:scale(1) } }

#gate-inner{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:0 24px; }
#gate-eyebrow{ opacity:0; margin-bottom:28px; }
#gate.phase-title #gate-eyebrow{ animation:fadeIn .8s ease forwards; }

#gate-title{ display:block; }
#gate-title .line{ display:block; overflow:hidden; }
#gate-title .ch{
  display:inline-block; opacity:0; filter:blur(10px); transform:translateY(4px);
  font-family:var(--serif); font-weight:900; letter-spacing:.08em; line-height:1.24;
  font-size:clamp(2.1rem,6.6vw,5.2rem); color:var(--moon);
}
#gate.phase-title #gate-title .ch{ animation:chIn .86s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes chIn{ from{ opacity:0; filter:blur(10px); transform:translateY(4px) } to{ opacity:1; filter:blur(0); transform:none } }
#gate-title .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold);
  margin-left:.24em; vertical-align:.62em; opacity:0;
}
#gate.phase-title #gate-title .dot{ animation:fadeIn .5s ease 1.5s forwards; }

/* 镜4：标题下 240px 细线展开 + 副文案 */
#gate-under{ width:0; height:1px; background:var(--ink-line-2); margin:34px 0 0; }
#gate.phase-copy #gate-under{ animation:underGrow .8s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes underGrow{ from{ width:0 } to{ width:240px } }
#gate-sub{ opacity:0; margin-top:20px; max-width:640px; color:var(--txt2); font-size:13.5px; line-height:2.05; }
#gate-sub b{ color:var(--moon); font-weight:400; }
#gate.phase-copy #gate-sub{ animation:fadeIn .8s ease .28s forwards; }

/* 镜5：HUD 竖排小字 + 按钮自细线长出 */
#gate-hud{ position:absolute; left:50%; bottom:calc(5vh + 44px); transform:translateX(-50%);
  display:flex; gap:30px; opacity:0; z-index:5; }
#gate.phase-hud #gate-hud{ animation:fadeIn .7s ease forwards; }
#gate-hud .h{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:rgba(221,230,240,.42); }
#gate-hud .h b{ font-family:var(--serif); font-weight:900; font-size:15px; color:var(--moon); margin-right:.4em; letter-spacing:.02em; }
#gate-cta{ margin-top:42px; opacity:0; display:flex; gap:18px; align-items:center; }
#gate.phase-hud #gate-cta{ animation:fadeIn .5s ease .2s forwards; }
#gate-cta .rule-x{ height:1px; background:var(--gold-dim); width:0; }
#gate.phase-hud #gate-cta .rule-x{ animation:ruleX .7s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes ruleX{ from{ width:0 } to{ width:40px } }
#skip{ position:absolute; right:20px; bottom:calc(5vh + 16px); z-index:8;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:rgba(221,230,240,.42);
  background:none; border:0; cursor:pointer; opacity:0; transition:color .24s ease; }
#gate.phase-title #skip{ animation:fadeIn .6s ease forwards; }
#skip:hover{ color:var(--moon); }
#gate-load{
  position:absolute; left:50%; top:50%; z-index:7; transform:translate(-50%,-50%);
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  border:1px solid rgba(228,177,94,.24); background:rgba(5,7,13,.84);
  font:10.5px/1.4 var(--mono); letter-spacing:.12em; color:rgba(221,230,240,.72);
  transition:opacity .35s ease, transform .35s ease;
}
#gate-load.off{ opacity:0; transform:translate(-50%,-44%); pointer-events:none; }
#gate-load::after{
  content:''; position:absolute; left:-1px; right:-1px; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  transform-origin:left; animation:bootLine 1.8s ease-in-out infinite;
}
@keyframes bootLine{ 0%{ transform:scaleX(.08); opacity:.25 } 55%{ transform:scaleX(.86); opacity:.9 } 100%{ transform:scaleX(1); opacity:.18 } }
.boot-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation:bootPulse 1.1s ease-in-out infinite; }
@keyframes bootPulse{ 0%,100%{ opacity:.28; transform:scale(.8) } 50%{ opacity:1; transform:scale(1.16) } }

/* ══════════════ 图谱 / 画布容器 ══════════════ */
.canvas-box{
  position:relative; width:100%; border:1px solid var(--ink-line); border-radius:var(--r);
  background:
    radial-gradient(ellipse 70% 60% at 50% 46%, rgba(143,176,216,.045), transparent 72%),
    var(--bg1);
  overflow:hidden;
}
.canvas-box canvas{ width:100%; height:100%; display:block; cursor:grab; }
.canvas-box canvas:active{ cursor:grabbing; }
/* 天球坐标网格（10% 透明度） */
.canvas-box .celestial{
  position:absolute; inset:0; pointer-events:none; opacity:.1;
  background-image:linear-gradient(rgba(221,230,240,.5) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(221,230,240,.5) 1px, transparent 1px);
  background-size:64px 64px;
}
.canvas-box .hint{
  position:absolute; left:12px; bottom:9px; font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; color:rgba(221,230,240,.3); pointer-events:none;
}
/* 图例：固定注明隐喻与赛题对应关系 */
.canvas-box .legend{
  position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:5px;
  padding:10px 12px; border:1px solid var(--ink-line); background:rgba(5,7,13,.72);
  font-family:var(--mono); font-size:9.5px; line-height:1.7; color:rgba(221,230,240,.5); letter-spacing:.04em;
}
.canvas-box .legend i{ display:inline-block; width:14px; height:1px; background:var(--ink-line-3);
  vertical-align:middle; margin-right:8px; }
.canvas-box .legend i.gold{ background:var(--gold); }
.canvas-box .legend i.star{ background:var(--star); }

/* ══════════════ 神经检索：结论浮层 + 观测档案面板 ══════════════ */
#neuro-line{
  position:absolute; left:16px; top:14px; z-index:4; max-width:min(560px,70%);
  padding:11px 14px; border-left:2px solid var(--gold); background:rgba(5,7,13,.8);
  font-family:var(--serif); font-size:14.5px; line-height:1.7; color:var(--moon);
  opacity:0; transform:translateY(-6px); transition:opacity .3s ease, transform .3s ease;
  pointer-events:none;
}
#neuro-line.on{ opacity:1; transform:none; }
#neuro-line .num{ font-weight:900; color:var(--gold); font-size:1.25em; padding:0 .1em; }

#dossier{
  position:fixed; top:28px; right:0; bottom:0; width:min(420px,92vw); z-index:80;
  background:var(--bg1); border-left:1px solid var(--ink-line-2);
  transform:translateX(102%); overflow-y:auto; padding:24px 26px 60px;
}
#dossier .d-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
#dossier h3{ font-family:var(--serif); font-weight:900; font-size:19px; letter-spacing:.05em; line-height:1.5; }
#dossier .d-meta{ margin-top:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:rgba(221,230,240,.4); }
#dossier .d-close{ background:none; border:0; cursor:pointer; font-family:var(--mono); font-size:11px;
  letter-spacing:.14em; color:var(--txt3); padding:2px 0; }
#dossier .d-close:hover{ color:var(--moon); }
#dossier .d-sec{ margin-top:24px; padding-top:16px; border-top:1px solid var(--ink-line); }
#dossier .d-sec h4{ font-family:var(--mono); font-size:10px; font-weight:400; letter-spacing:.2em;
  color:rgba(221,230,240,.36); margin-bottom:12px; text-transform:uppercase; }
#dossier .kv{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:12.5px; }
#dossier .kv span{ color:var(--txt2); }
#dossier .kv b{ font-family:var(--serif); font-weight:700; font-size:14px; color:var(--moon); }
#dossier .kv b.gold{ color:var(--gold); }
/* 传导路径：树的可视化 */
.path-node{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:12.5px; color:var(--txt2); }
.path-node .dot{ width:7px; height:7px; border-radius:50%; border:1px solid var(--ink-line-3); flex:none;
  transition:background .3s ease, border-color .3s ease; }
.path-node.lit{ color:var(--moon); }
.path-node.lit .dot{ background:var(--gold); border-color:var(--gold); }
.path-node .seg{ flex:1; height:1px; background:var(--ink-line); }
.path-node .seg.lit{ background:var(--gold-dim); }
.path-arrow{ font-family:var(--mono); font-size:10px; color:rgba(221,230,240,.3); padding-left:2px; }

/* ══════════════ 数据罗盘（总览主角） ══════════════ */
#compass-wrap{ position:relative; width:100%; aspect-ratio:1/1; max-width:620px; margin:0 auto; }
#compass{ width:100%; height:100%; display:block; }
.compass-cap{
  position:absolute; left:0; right:0; bottom:-4px; text-align:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:rgba(221,230,240,.32);
}

/* ══════════════ 六联 mono 面板（查询效率） ══════════════ */
.sixgrid{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); border-top:1px solid var(--ink-line-2); }
.sixgrid > div{ padding:14px 16px; border-right:1px solid var(--ink-line); border-bottom:1px solid var(--ink-line); }
.sixgrid > div:last-child{ border-right:0; }
.sixgrid .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:rgba(221,230,240,.34); }
.sixgrid .v{ font-family:var(--serif); font-weight:900; font-size:26px; line-height:1.2; margin-top:6px; color:var(--moon); }
.sixgrid .v.gold{ color:var(--gold); }
.sixgrid .u{ font-family:var(--mono); font-size:10px; color:var(--txt3); margin-left:3px; }
@media (max-width:900px){ .sixgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:560px){ .sixgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
/* 细线刻度尺 0–1–3–5s */
.ruler{ position:relative; height:44px; margin-top:22px; border-top:1px solid var(--ink-line-2); }
.ruler .tick{ position:absolute; top:0; width:1px; height:8px; background:var(--ink-line-2); }
.ruler .tick.major{ height:14px; background:var(--ink-line-3); }
.ruler .tick span{ position:absolute; top:18px; left:-8px; width:60px;
  font-family:var(--mono); font-size:9.5px; color:rgba(221,230,240,.36); letter-spacing:.08em; }
.ruler .cursor{ position:absolute; top:-4px; width:1px; height:22px; background:var(--gold);
  transition:left .5s cubic-bezier(.2,.8,.2,1); }
.ruler .cursor::after{ content:''; position:absolute; top:-4px; left:-2.5px; width:6px; height:6px;
  border-radius:50%; background:var(--gold); }
.ruler .cursor b{ position:absolute; top:-22px; left:-24px; width:60px; text-align:center;
  font-family:var(--serif); font-weight:900; font-size:15px; color:var(--gold); }

/* ══════════════ 数据接入流水线（白色流线束仅此处使用） ══════════════ */
.pipeline{ position:relative; display:flex; flex-direction:column; gap:0; margin-top:18px; padding-left:26px; }
.pipeline::before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--ink-line); }
#pipe-line{ position:absolute; left:5px; top:6px; width:1px; background:var(--gold); height:0;
  transition:height .5s cubic-bezier(.2,.8,.2,1); }
.step{ position:relative; display:flex; align-items:center; gap:14px; padding:13px 0;
  border-bottom:1px solid var(--ink-line); }
.step:last-child{ border-bottom:0; }
.step .dot{ position:absolute; left:-26px; width:11px; height:11px; border-radius:50%;
  border:1px solid var(--ink-line-2); background:var(--bg0); }
.step.run .dot{ border-color:var(--gold); background:var(--gold); }
.step.done .dot{ border-color:var(--gold-dim); background:var(--bg0); }
.step.done .dot::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--gold-dim); }
.step .t{ flex:1; min-width:200px; }
.step .t b{ font-family:var(--serif); font-weight:700; font-size:14px; letter-spacing:.04em; display:block; }
.step .t small{ font-family:var(--mono); font-size:10px; color:var(--txt3); letter-spacing:.08em; }
.step .ms{ font-family:var(--mono); font-size:11px; color:var(--txt2); flex:0 1 auto; max-width:62%; text-align:right; line-height:1.55; }
/* 阶段间的白色流线束 */
.flow{ position:relative; height:14px; margin:-7px 0; overflow:hidden; }
.flow i{ position:absolute; left:0; top:50%; width:100%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(221,230,240,.5), transparent);
  transform:translateX(-100%); }
.flow.go i{ animation:flowIn .55s ease-out forwards; }
@keyframes flowIn{ to{ transform:translateX(100%) } }

/* ══════════════ 上传区 ══════════════ */
.drop{ border:1px dashed var(--ink-line-2); border-radius:var(--r); padding:30px 20px; text-align:center;
  cursor:pointer; transition:border-color .28s ease, background .28s ease; }
.drop:hover,.drop.over{ border-color:var(--gold-dim); background:rgba(228,177,94,.05); }
.drop .big{ font-family:var(--serif); font-weight:700; font-size:15.5px; letter-spacing:.05em; }
.drop .small{ margin-top:10px; font-size:11.5px; color:var(--txt3); line-height:1.9; }

/* ══════════════ 场景选择（观测台按钮） ══════════════ */
.pick{ display:flex; flex-wrap:wrap; gap:8px; max-height:176px; overflow:auto; padding:2px 0 4px; }
.pick button{
  padding:6px 13px; border:1px solid var(--ink-line); border-radius:var(--r); background:none;
  color:var(--txt2); font-size:12px; cursor:pointer; font-family:inherit;
  transition:border-color .24s ease, color .24s ease;
}
.pick button:hover{ border-color:var(--ink-line-2); color:var(--moon); }
.pick button.on{ border-color:var(--gold); color:var(--gold-hi); }

/* ══════════════ 进度条 / 提示浮层 ══════════════ */
#prog{ position:fixed; top:28px; left:0; right:0; height:1px; z-index:70; background:transparent; }
#prog i{ display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:0 50%; background:var(--gold-dim); }
#tip{
  position:fixed; z-index:120; pointer-events:none; opacity:0; transform:translate(-50%,-114%);
  padding:9px 12px; border:1px solid var(--ink-line-2); background:rgba(5,7,13,.95);
  font-size:12px; line-height:1.75; max-width:300px; transition:opacity .16s ease;
}
#tip b{ font-family:var(--serif); font-weight:700; color:var(--moon); }
#tip .m{ font-family:var(--serif); font-weight:700; color:var(--gold); }

/* ══════════════ 空结果与数据边界说明 ══════════════ */
.empty-reason{
  margin: 18px;
  padding: 16px 18px 14px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(228,177,94,.045);
}
.empty-reason strong{
  display:block;
  font-family:var(--serif);
  font-size:16px;
  color:var(--moon);
  margin-bottom:8px;
}
.empty-reason p{
  margin:0 0 6px;
  color:var(--txt2);
  font-size:12.5px;
  line-height:1.85;
}
.empty-reason .empty-hint{
  color:var(--txt3);
  font-size:11.5px;
  margin-bottom:0;
}
.reason-cell{
  display:inline-block;
  max-width:230px;
  color:var(--txt3);
  font-size:10.5px;
  line-height:1.65;
  vertical-align:top;
}
.supplier-picker{ display:flex; flex-direction:column; gap:10px; }
.supplier-selected{ display:flex; flex-wrap:wrap; gap:7px; min-height:30px; max-height:150px; overflow:auto; }
.supplier-chip{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.supplier-chip span{ margin-left:5px; color:var(--gold-hi); }
.supplier-controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.supplier-controls input{ min-width:240px; flex:1 1 260px; }
.supplier-controls select{ min-width:260px; max-width:100%; flex:1 1 320px; }
.supplier-controls .btn{ flex:none; }

/* ══════════════ 页脚 ══════════════ */
.foot{ margin-top:56px; padding-top:22px; border-top:1px solid var(--ink-line);
  display:flex; flex-direction:column; gap:7px;
  font-family:var(--mono); font-size:10.5px; line-height:1.9; color:rgba(221,230,240,.3); }

/* ══════════════ 揭示动画（位移一律交给 JS spring，这里只做透明度） ══════════════ */
.reveal{ opacity:0; transition:opacity .5s ease-out var(--rd,0s); }
.reveal.in{ opacity:1; }

/* ══════════════ 无障碍 / 降级 ══════════════ */
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  #gate{ display:none; }
  .reveal{ opacity:1; transition:none; }
  #bg-video{ display:none; }
  /* 全站唯一 LUT 在 reduced-motion 下关闭（用局部变量覆盖，不另写 filter） */
  body{ --lut:none; }
}
#nojs{ display:none; padding:60px 24px; max-width:860px; margin:0 auto; line-height:2; }
noscript ~ * #nojs{ display:block; }

/* 中标浮标「到站提货」入场：从建图团方向滑入 + 金边一闪（与到站脉冲同拍） */
.wf-chip{ transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1); }
.wf-chip.arrive{ animation:wfChipIn .55s cubic-bezier(.16,1,.3,1) both; }
@keyframes wfChipIn{
  0%{ opacity:0; transform:translateX(30px); border-color:rgba(228,177,94,.85); box-shadow:0 0 22px rgba(228,177,94,.28); }
  60%{ opacity:1; border-color:rgba(228,177,94,.45); }
  100%{ opacity:1; transform:none; border-color:var(--line); box-shadow:var(--shadow); }
}

</style>
</head>
